name: CI

on:
  # after merges: dev is checked again, and these runs write the build cache. main needs no run of its
  # own: it only receives the release PR, which was checked before the merge, and the release workflow
  # builds every push to it.
  push:
    branches: [dev]
  # everything else runs for pull requests, from this repository and from forks. A branch without a
  # pull request is not built, so open the PR early (as a draft) to get feedback.
  # The exception is the draft release PR (dev -> main): it stays a draft between releases and its head is
  # dev, which the push runs have just checked. Its jobs are skipped until it is marked ready for review
  # (a draft cannot be merged, so the skipped required checks let nothing through).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The checks run as parallel jobs; the `check` job at the end is the single required check that
  # waits for all of them (see .github/rulesets).
  rust:
    name: rust (fmt, lints, tests)
    if: ${{ !(github.event.pull_request.draft && github.base_ref == 'main' && github.head_ref == 'dev') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      # headers some windowing / GL crates look for while building
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --release --all-targets --locked -- -D warnings
      # includes the parity tests against the Python reference cases in tests/reference
      - name: Tests
        run: cargo test --release --locked

  licenses:
    name: licenses
    if: ${{ !(github.event.pull_request.draft && github.base_ref == 'main' && github.head_ref == 'dev') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # all dependencies must have a license that is compatible with the GPL-3.0 (see deny.toml),
      # and the third-party notices for the release archives must be generatable (about.toml)
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.22.0,cargo-about@0.9.3
      - name: Dependency licenses
        run: cargo deny --locked check licenses
      - name: Third-party license notices
        run: cargo about generate about.hbs -o third-party-licenses.txt

  scripts:
    name: scripts (release script, Python)
    if: ${{ !(github.event.pull_request.draft && github.base_ref == 'main' && github.head_ref == 'dev') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Release script tests
        # an explicit file: Node 22 does not expand a directory argument (newer versions do)
        run: node --test scripts/release.test.mjs
      - uses: astral-sh/setup-uv@v6
      - name: Python reference implementation
        working-directory: python
        run: |
          uv run --group dev ruff check .
          uv run --group dev ruff format --check .
          uv run --group dev pytest -q

  # The one required check named "check". It must not be skipped when a job failed, hence always().
  check:
    name: check
    if: ${{ always() && !(github.event.pull_request.draft && github.base_ref == 'main' && github.head_ref == 'dev') }}
    needs: [rust, licenses, scripts]
    runs-on: ubuntu-latest
    steps:
      - name: All checks succeeded
        run: |
          echo "rust: ${{ needs.rust.result }}, licenses: ${{ needs.licenses.result }}, scripts: ${{ needs.scripts.result }}"
          test "${{ needs.rust.result }}" = success
          test "${{ needs.licenses.result }}" = success
          test "${{ needs.scripts.result }}" = success

  # The release builds run in parallel, one job each: the desktop app for Linux (glibc 2.28) and
  # Windows, and the core for WebAssembly. They catch linker and cross-compilation problems before a
  # release; the packages are only published by the release workflow. They start together with `check`
  # (no `needs`), so the wall time is the longest job. The `build` job at the end is
  # the single required check that waits for all of them.
  build-desktop:
    name: build (${{ matrix.target }})
    # only build for main and dev: on pushes to dev and on pull requests targeting either
    if: >-
      github.event_name == 'push' ||
      ((github.base_ref == 'main' || github.base_ref == 'dev') &&
      !(github.event.pull_request.draft && github.base_ref == 'main' && github.head_ref == 'dev'))
    strategy:
      fail-fast: false # a failure on one platform does not hide the result of the other
      matrix:
        target: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }} # matrix jobs share the job name, so they need separate caches
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.24.1,cargo-about@0.9.3
      - name: Install zig
        run: |
          python3 -m venv .zigenv
          .zigenv/bin/pip install ziglang==0.17.1
          echo "$PWD/.zigenv/bin" >> "$GITHUB_PATH"
      - name: Build desktop app
        run: scripts/build-release.sh ${{ matrix.target }}

  build-web:
    name: build (web)
    if: >-
      github.event_name == 'push' ||
      ((github.base_ref == 'main' || github.base_ref == 'dev') &&
      !(github.event.pull_request.draft && github.base_ref == 'main' && github.head_ref == 'dev'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      # the core and the line types must stay buildable for WebAssembly (no std::fs, std::thread or
      # Instant in them): the module is built and run through the reference cases
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130 # the version of the wasm-bindgen crate in Cargo.lock
      - name: Build the WebAssembly module
        run: scripts/build-web.sh
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # the reference cases of the Python tool through the wasm module
      - name: Reference cases through WebAssembly
        run: node web/tests/reference.mjs
      - name: Web frontend (install, type check, tests, build)
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npx vite build
      # the built site in a real browser (wasm, Web Worker, all tabs); needs the site built above
      - name: Browser tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
      - name: Keep the traces of failed browser tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 3

  # The one required check named "build" (see .github/rulesets). It must not be skipped when a build
  # failed, hence always(); it only runs where the builds run.
  build:
    name: build
    if: >-
      always() && (github.event_name == 'push' ||
      ((github.base_ref == 'main' || github.base_ref == 'dev') &&
      !(github.event.pull_request.draft && github.base_ref == 'main' && github.head_ref == 'dev')))
    needs: [build-desktop, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: All builds succeeded
        run: |
          echo "desktop: ${{ needs.build-desktop.result }}, web: ${{ needs.build-web.result }}"
          test "${{ needs.build-desktop.result }}" = success
          test "${{ needs.build-web.result }}" = success
