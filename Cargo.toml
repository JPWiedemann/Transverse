[workspace]
resolver = "2"
members = [
    "crates/transverse-core",
    "crates/transverse-lines",
    "crates/transverse-gui",
    "crates/transverse-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# faer: pinned, the sparse API changes between releases. Feature set verified on native and wasm32.
faer = { version = "=0.24.4", default-features = false, features = ["std", "sparse-linalg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
transverse-core = { path = "crates/transverse-core" }
transverse-lines = { path = "crates/transverse-lines" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# tests and examples run optimised too: the solver is slow in debug builds
[profile.test]
opt-level = 3
