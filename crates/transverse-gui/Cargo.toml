[package]
name = "transverse-gui"
description = "Desktop application for Transverse (form state, settings and worker are UI-independent)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
transverse-core.workspace = true
transverse-lines.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "clipboard"] }
egui_plot = "0.38.0"

[[bin]]
name = "transverse-gui"
path = "src/main.rs"
