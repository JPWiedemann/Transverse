[package]
name = "transverse-wasm"
description = "WebAssembly layer for Transverse: the line models for the web frontend, no logic of its own"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
transverse-core.workspace = true
transverse-lines.workspace = true
serde.workspace = true
serde_json.workspace = true
# pinned to the wasm-bindgen CLI used in CI (scripts/build-web.sh, release.yml)
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
