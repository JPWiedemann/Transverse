# License check of all dependencies (cargo deny check licenses), run in CI.
# Transverse is GPL-3.0-only; everything below is compatible with that.

[graph]
# only what is actually built: the desktop targets and WebAssembly
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu", "wasm32-unknown-unknown"]

[licenses]
allow = [
    "GPL-3.0-only", # the workspace crates themselves
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "OFL-1.1", # fonts bundled with egui
    "Ubuntu-font-1.0", # fonts bundled with egui
]
confidence-threshold = 0.8
