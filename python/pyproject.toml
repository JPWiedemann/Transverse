[project]
name = "transverse-python"
version = "0.5.0"
description = "2D quasi-static field solver for CPWG / stripline-type CPW in PCB inner layers (Python reference implementation)"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[dependency-groups]
dev = ["ruff", "ty", "pytest"]
build = ["pyinstaller>=6"]

[tool.uv]
package = false   # single-module application: run with `uv run cpwg_solver.py`

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "E731",    # lambda assignment: used for short local helpers
    "RUF001",  # ambiguous unicode (µ, λ) in strings is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
